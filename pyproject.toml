[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crownscope"
version = "0.0.1"
description = "Flags text likely to be mass-produced with generative AI, with evidence, for human review (Korean blog and shopping content)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2", "numpy>=1.21"]  # embed_sim (FR-3.5); the model itself is named in the pack
model = ["transformers>=4.40", "torch>=2.1"]  # language-model scoring (FR-3.6+); the model is named in the pack

[project.scripts]
crownscope = "crownscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crownscope"]
include = ["src/crownscope/packs/*.yml"]
